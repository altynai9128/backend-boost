<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой кабинет — Backend Boost</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #faf5ff;
      color: #1a1a2e;
      min-height: 100vh;
    }

    .header {
      background: white;
      padding: 16px 0;
      border-bottom: 1px solid #f0e6ff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .logo a {
      text-decoration: none;
      background: linear-gradient(135deg, #8B5CF6, #FF69B4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-actions .score {
      background: #faf5ff;
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid #f0e6ff;
    }

    .header-actions .score span {
      color: #8B5CF6;
    }

    .btn-logout {
      padding: 8px 20px;
      border: 1px solid #fee2e2;
      border-radius: 50px;
      background: white;
      color: #dc2626;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-logout:hover {
      background: #fee2e2;
    }

    .btn-logout:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .welcome {
      background: linear-gradient(135deg, #1a1a2e, #2d1b69);
      color: white;
      padding: 30px 40px;
      border-radius: 20px;
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #ccc;
      font-size: 16px;
    }

    .welcome .status {
      margin-top: 12px;
      display: inline-block;
      padding: 4px 16px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
    }

    .status.paid {
      background: #16a34a;
      color: white;
    }

    .status.unpaid {
      background: #f59e0b;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #f0e6ff;
      text-align: center;
    }

    .stat-card .number {
      font-size: 32px;
      font-weight: 800;
      color: #8B5CF6;
    }

    .stat-card .label {
      font-size: 14px;
      color: #888;
      margin-top: 4px;
    }

    .leaderboard {
      background: white;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #f0e6ff;
      margin-bottom: 30px;
    }

    .leaderboard h2 {
      font-size: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leaderboard table {
      width: 100%;
      border-collapse: collapse;
    }

    .leaderboard th {
      text-align: left;
      padding: 10px 12px;
      font-size: 13px;
      text-transform: uppercase;
      color: #888;
      font-weight: 600;
      border-bottom: 2px solid #f0e6ff;
    }

    .leaderboard td {
      padding: 10px 12px;
      border-bottom: 1px solid #f5f0ff;
      font-size: 15px;
    }

    .leaderboard tr:last-child td {
      border-bottom: none;
    }

    .leaderboard .rank {
      font-weight: 700;
      color: #888;
      width: 40px;
    }

    .leaderboard .rank.top1 { color: #FFD700; }
    .leaderboard .rank.top2 { color: #C0C0C0; }
    .leaderboard .rank.top3 { color: #CD7F32; }

    .leaderboard .you {
      background: #faf5ff;
      font-weight: 600;
      border-radius: 8px;
    }

    .leaderboard .you td {
      border-bottom: 2px solid #8B5CF6;
    }

    .leaderboard .divider td {
      padding: 8px 0;
      color: #888;
      font-size: 13px;
      text-align: center;
      border-bottom: 1px dashed #f0e6ff;
    }

    .stream-info {
      background: #f0e6ff;
      padding: 14px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: 500;
      color: #2d1b69;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stream-info .stream-name {
      font-size: 18px;
      font-weight: 700;
    }

    .stream-info .stream-details {
      font-size: 15px;
      color: #4a3a7a;
    }

    .modules h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .module {
      background: white;
      border-radius: 16px;
      border: 1px solid #f0e6ff;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .module-header {
      padding: 16px 24px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .module-header:hover {
      background: #faf5ff;
    }

    .module-header .title {
      font-weight: 600;
      font-size: 18px;
    }

    .module-header .progress-text {
      font-size: 14px;
      color: #888;
    }

    .module-body {
      padding: 0 24px 24px;
      display: none;
    }

    .module-body.open {
      display: block;
    }

    .lesson {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f5f0ff;
    }

    .lesson:last-child {
      border-bottom: none;
    }

    .lesson .info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lesson .info .num {
      font-size: 14px;
      font-weight: 600;
      color: #888;
      width: 28px;
    }

    .lesson .info .name {
      font-size: 15px;
    }

    .lesson .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lesson .points {
      font-size: 14px;
      color: #888;
    }

    .lesson .points.done {
      color: #16a34a;
      font-weight: 600;
    }

    .btn-complete {
      padding: 4px 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #8B5CF6, #FF69B4);
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-complete:hover:not(:disabled) {
      transform: scale(1.05);
    }

    .btn-complete:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-complete.done {
      background: #16a34a;
    }

    .lesson-content {
      display: none;
      margin-top: 12px;
      padding: 16px;
      background: #faf5ff;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.7;
      color: #333;
    }

    .lesson-content.open {
      display: block;
    }

    .lesson-content .video-placeholder {
      background: #1a1a2e;
      color: white;
      padding: 40px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .payment-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .payment-banner p {
      color: #92400e;
      font-weight: 500;
    }

    .payment-banner .btn-pay {
      padding: 10px 28px;
      border: none;
      border-radius: 50px;
      background: #f59e0b;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .payment-banner .btn-pay:hover {
      background: #d97706;
    }

    .locked-overlay {
      text-align: center;
      padding: 30px 20px;
      color: #888;
      font-size: 16px;
      background: #faf5ff;
      border-radius: 12px;
      margin: 10px 0;
    }

    .locked-overlay .lock-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 12px;
    }

    .locked-overlay strong {
      color: #1a1a2e;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1a1a2e;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: none;
      z-index: 999;
      max-width: 400px;
    }

    .toast.success { border-left: 4px solid #16a34a; }
    .toast.error { border-left: 4px solid #dc2626; }

    @media (max-width: 768px) {
      .welcome {
        padding: 20px;
      }
      .welcome h1 {
        font-size: 22px;
      }
      .header .container {
        flex-wrap: wrap;
        gap: 10px;
      }
      .module-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .leaderboard table {
        font-size: 13px;
      }
      .leaderboard th, .leaderboard td {
        padding: 6px 8px;
      }
      .stream-info {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="container">
    <div class="logo"><a href="/index.html">✦ Backend Boost</a></div>
    <div class="header-actions">
      <div class="score">🏆 <span id="userScore">0</span> баллов</div>
      <button class="btn-logout" id="logoutBtn">Выйти</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="welcome" id="welcomeBlock">
    <h1 id="greeting">Загрузка...</h1>
    <p id="userEmail">Загрузка...</p>
    <div class="status unpaid" id="paymentStatus">⏳ Загрузка...</div>
  </div>

  <div class="stream-info" id="streamInfo">
    <span class="stream-name" id="streamName">Загрузка...</span>
    <span class="stream-details" id="streamDetails">Старт курса: загрузка...</span>
  </div>

  <div class="payment-banner" id="paymentBanner" style="display:none;">
    <p>💰 Ты еще не оплатил курс. После оплаты откроется доступ ко всем урокам.</p>
    <button class="btn-pay" id="payBtn">Перейти к оплате</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="number" id="lessonsCompleted">0</div>
      <div class="label">Уроков пройдено</div>
    </div>
    <div class="stat-card">
      <div class="number" id="totalLessons">30</div>
      <div class="label">Всего уроков</div>
    </div>
    <div class="stat-card">
      <div class="number" id="yourRank">-</div>
      <div class="label" id="rankLabel">Твое место</div>
    </div>
  </div>

  <div class="leaderboard">
    <h2>🏅 Таблица лидеров</h2>
    <div id="leaderboardContainer">
      <p style="color: #888;">Загрузка...</p>
    </div>
  </div>

  <div class="modules">
    <h2>📚 Программа курса</h2>
    <div id="modulesContainer">
      <p style="color: #888;">Загрузка...</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  (function() {

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let allModules = [];
    let allLessons = [];
    let userProgress = [];
    let allProfiles = [];
    let isPaid = false;
    let currentStream = null;
    let isCourseStarted = false;

    function showToast(message, type) {
      type = type || 'success';
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 4000);
    }

    function checkAuth() {
      return supabaseClient.auth.getSession().then(function(result) {
        var data = result.data;
        var error = result.error;
        if (error || !data.session) {
          window.location.href = '/login.html';
          return null;
        }
        currentUser = data.session.user;
        return currentUser;
      });
    }

    function loadData() {
      return supabaseClient
        .from('modules')
        .select('*')
        .order('order_num')
        .then(function(result) {
          if (result.error) throw result.error;
          allModules = result.data;

          return supabaseClient
            .from('lessons')
            .select('*')
            .order('order_num');
        })
        .then(function(result) {
          if (result.error) throw result.error;
          allLessons = result.data;

          return supabaseClient
            .from('progress')
            .select('*')
            .eq('user_id', currentUser.id);
        })
        .then(function(result) {
          if (result.error) throw result.error;
          userProgress = result.data || [];

          return supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();
        })
        .then(function(result) {
          if (result.error) {
            if (result.error.code === 'PGRST116') {
              return supabaseClient
                .from('profiles')
                .insert([{
                  id: currentUser.id,
                  email: currentUser.email,
                  full_name: currentUser.user_metadata?.full_name || 'Студент',
                  country: currentUser.user_metadata?.country || 'Не указана',
                  is_paid: false,
                  total_score: 0
                }])
                .then(function() {
                  return supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                });
            }
            throw result.error;
          }
          return result;
        })
        .then(function(result) {
          var profile = result.data;
          isPaid = profile.is_paid || false;

          return supabaseClient
            .from('streams')
            .select('*')
            .eq('id', profile.stream_id)
            .single()
            .then(function(streamResult) {
              if (streamResult.data) {
                currentStream = streamResult.data;
                isCourseStarted = currentStream.course_started || false;
              }

              return supabaseClient
                .from('profiles')
                .select('*')
                .eq('stream_id', profile.stream_id)
                .eq('is_paid', true)
                .order('total_score', { ascending: false });
            })
            .then(function(profilesResult) {
              allProfiles = profilesResult.data || [];
              return { profile: profile, progress: userProgress };
            });
        })
        .catch(function(err) {
          console.error('Ошибка загрузки:', err);
          showToast('Ошибка загрузки данных: ' + err.message, 'error');
          return null;
        });
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'не установлена';
      var d = new Date(dateStr);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function renderDashboard(profile) {
      var userName = profile.full_name || 'Студент';
      document.getElementById('greeting').textContent = 'Привет, ' + userName + '! 👋';
      document.getElementById('userEmail').textContent = currentUser.email;

      var statusEl = document.getElementById('paymentStatus');
      var banner = document.getElementById('paymentBanner');
      if (profile.is_paid) {
        statusEl.textContent = '✅ Оплачено';
        statusEl.className = 'status paid';
        banner.style.display = 'none';
        isPaid = true;
      } else {
        statusEl.textContent = '⏳ Ожидает оплаты';
        statusEl.className = 'status unpaid';
        banner.style.display = 'flex';
        isPaid = false;
      }

      document.getElementById('userScore').textContent = profile.total_score || 0;

      if (currentStream) {
        var paidCount = allProfiles.filter(function(p) { return p.is_paid; }).length;
        document.getElementById('streamName').textContent = currentStream.name + ' (' + paidCount + '/50)';
        var startDate = currentStream.start_date ? formatDate(currentStream.start_date) : 'не установлена';
        document.getElementById('streamDetails').textContent = 'Старт курса: ' + startDate;
      } else {
        document.getElementById('streamName').textContent = 'Поток не назначен';
        document.getElementById('streamDetails').textContent = 'Оплати курс, чтобы попасть в поток';
      }

      var completed = userProgress.filter(function(p) { return p.is_completed; }).length;
      document.getElementById('lessonsCompleted').textContent = completed;
      document.getElementById('totalLessons').textContent = allLessons.length;

      var rankLabel = document.getElementById('rankLabel');
      if (!isCourseStarted) {
        document.getElementById('yourRank').textContent = '⏳';
        rankLabel.textContent = 'Рейтинг ожидается';
      } else {
        var sorted = allProfiles.filter(function(p) { return p.is_paid; }).sort(function(a, b) { return (b.total_score || 0) - (a.total_score || 0); });
        var rank = sorted.findIndex(function(p) { return p.id === currentUser.id; }) + 1;
        document.getElementById('yourRank').textContent = rank > 0 ? '#' + rank : '-';
        rankLabel.textContent = 'Твое место';
      }

      renderLeaderboard();
      renderModules();
    }

  var sorted = allProfiles.filter(function(p) { return p.is_paid; }).sort(function(a, b) {
    return (b.total_score || 0) - (a.total_score || 0);
  });

    container.innerHTML = '<p style="color: #888;">Пока нет оплативших студентов в твоем потоке</p>';
    return;
  }

    listHtml += '</ul></div>';

    html += '<td>' + (currentUserData.full_name || 'Аноним') + ' (ты)' + '</td>';
    html += '<td>' + (currentUserData.total_score || 0) + '</td>';
    html += '</tr>';
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

      html += '</tbody></table>';

    function renderModules() {
      var container = document.getElementById('modulesContainer');

      if (allModules.length === 0) {
        container.innerHTML = '<p style="color: #888;">Модули пока не загружены</p>';
        return;
      }

      var html = '';
      allModules.forEach(function(mod) {
        var lessons = allLessons.filter(function(l) { return l.module_id === mod.id; });
        var completedInModule = lessons.filter(function(l) {
          return userProgress.some(function(p) { return p.lesson_id === l.id && p.is_completed; });
        }).length;

        html += '<div class="module"><div class="module-header" onclick="window.toggleModule(this)">';
        html += '<span class="title">' + mod.title + '</span>';
        html += '<span class="progress-text">' + completedInModule + '/' + lessons.length + ' уроков</span>';
        html += '</div><div class="module-body">';

        if (!isPaid) {
          html += '<div class="locked-overlay"><span class="lock-icon">🔒</span><strong>Станет доступно после оплаты курса</strong>';
          html += '<p style="margin-top:8px;font-size:14px;color:#999;">Оплати курс, чтобы получить доступ ко всем урокам</p></div>';
        } else if (!isCourseStarted) {
          html += '<div class="locked-overlay"><span class="lock-icon">⏳</span><strong>Курс еще не начался</strong>';
          html += '<p style="margin-top:8px;font-size:14px;color:#999;">Дождись старта потока, чтобы начать обучение</p></div>';
        } else {
          lessons.forEach(function(lesson, idx) {
            var prog = userProgress.find(function(p) { return p.lesson_id === lesson.id; });
            var isDone = prog && prog.is_completed;

            html += '<div class="lesson"><div class="info">';
            html += '<span class="num">' + String(idx + 1).padStart(2, '0') + '</span>';
            html += '<span class="name">' + lesson.title + '</span>';
            html += '</div><div class="actions">';
            html += '<span class="points ' + (isDone ? 'done' : '') + '">' + (isDone ? '✅ +' : '+') + lesson.points + '</span>';
            html += '<button class="btn-complete ' + (isDone ? 'done' : '') + '" data-lesson-id="' + lesson.id + '" ' + (isDone ? 'disabled' : '') + ' onclick="window.completeLesson(' + lesson.id + ', this)">';
            html += isDone ? '✅ Пройдено' : 'Завершить';
            html += '</button></div></div>';
          });
        }

        html += '</div></div>';
      });

      container.innerHTML = html;
    }

    window.toggleModule = function(header) {
      var body = header.nextElementSibling;
      body.classList.toggle('open');
    };

    window.completeLesson = function(lessonId, btn) {
      if (!isPaid) {
        showToast('⚠️ Оплати курс и дождись старта обучения, чтобы открыть уроки', 'error');
        return;
      }
      if (!isCourseStarted) {
        showToast('⏳ Курс еще не начался', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳';

      var existing = userProgress.find(function(p) { return p.lesson_id === lessonId; });
      if (existing && existing.is_completed) {
        showToast('Урок уже пройден', 'error');
        btn.disabled = false;
        btn.textContent = '✅ Пройдено';
        return;
      }

      supabaseClient
        .from('progress')
        .insert([{
          user_id: currentUser.id,
          lesson_id: lessonId,
          is_completed: true,
          completed_at: new Date().toISOString()
        }])
        .then(function() {
          userProgress.push({ user_id: currentUser.id, lesson_id: lessonId, is_completed: true });
          showToast('🎉 Урок пройден! +10 баллов', 'success');
          location.reload();
        })
        .catch(function(err) {
          console.error(err);
          showToast('Ошибка: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Завершить';
        });
    };

    document.addEventListener('DOMContentLoaded', function() {
      var logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
          e.preventDefault();
          supabaseClient.auth.signOut().then(function() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/index.html';
          });
        });
      }

      var payBtn = document.getElementById('payBtn');
      if (payBtn) {
        payBtn.addEventListener('click', function() {
          window.location.href = '/payment.html';
        });
      }

      checkAuth().then(function(user) {
        if (!user) return;
        return loadData().then(function(result) {
          if (result) {
            renderDashboard(result.profile);
          }
        });
      });
    });
  })();
</script>

</body>
</html>
