<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сброс пароля — Backend Boost</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #faf5ff, #fff5f9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(139, 92, 246, 0.15);
      border: 1px solid #f0e6ff;
    }

    .auth-card .logo {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-card .logo a {
      text-decoration: none;
      background: linear-gradient(135deg, #8B5CF6, #FF69B4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-card .subtitle {
      text-align: center;
      color: #666;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .auth-card label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .auth-card input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #f0e6ff;
      border-radius: 12px;
      font-size: 16px;
      transition: border 0.3s;
      margin-bottom: 16px;
      background: #fafafa;
    }

    .auth-card input:focus {
      outline: none;
      border-color: #8B5CF6;
      background: white;
    }

    .auth-card .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #8B5CF6, #FF69B4);
      color: white;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .auth-card .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
    }

    .auth-card .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .success-msg {
      background: #dcfce7;
      color: #16a34a;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }

    .footer-text a {
      color: #8B5CF6;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="logo"><a href="/index.html">✦ Backend Boost</a></div>
  <div class="subtitle">Сброс пароля</div>

  <div id="errorMsg" class="error-msg"></div>
  <div id="successMsg" class="success-msg"></div>

  <form id="resetForm">
    <label for="newPassword">Новый пароль (минимум 6 символов)</label>
    <input type="password" id="newPassword" placeholder="••••••••" minlength="6" required oninput="checkForm()" />

    <label for="confirmPassword">Подтверди пароль</label>
    <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required oninput="checkForm()" />

    <button type="submit" class="btn" id="submitBtn" disabled>Сохранить пароль</button>
  </form>

  <div class="footer-text">
    <a href="/login.html">Войти</a>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ssvefponwetcgpbfxepn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzdmVmcG9ud2V0Y2dwYmZ4ZXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTc0NzIsImV4cCI6MjEwMDg3MzQ3Mn0.2tKEk-ssC1ov04mMNQrMGPHRTTDyrnhmjVfCT5lwr0I';

  function checkForm() {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    const submitBtn = document.getElementById('submitBtn');

    if (newPass.length >= 6 && confirmPass.length >= 6 && newPass === confirmPass) {
      submitBtn.disabled = false;
    } else {
      submitBtn.disabled = true;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (typeof supabase === 'undefined') {
      errorMsg.textContent = '⚠️ Ошибка загрузки Supabase. Попробуй обновить страницу.';
      errorMsg.style.display = 'block';
      return;
    }

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');

    if (!accessToken) {
      errorMsg.textContent = '⚠️ Ссылка для сброса пароля недействительна или устарела. Попробуй запросить новую.';
      errorMsg.style.display = 'block';
      submitBtn.disabled = true;
      return;
    }

    supabaseClient.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken
    }).then(({ data, error }) => {
      if (error) {
        errorMsg.textContent = '⚠️ ' + error.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = true;
      } else {
        successMsg.textContent = '✅ Токен подтверждён. Придумай новый пароль.';
        successMsg.style.display = 'block';
      }
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 6) {
        errorMsg.textContent = '⚠️ Пароль должен быть минимум 6 символов.';
        errorMsg.style.display = 'block';
        return;
      }

      if (newPassword !== confirmPassword) {
        errorMsg.textContent = '⚠️ Пароли не совпадают.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loader"></span> Сохранение...';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) {
          throw new Error(error.message);
        }

        successMsg.textContent = '✅ Пароль успешно обновлён! Перенаправляем на вход...';
        successMsg.style.display = 'block';
        errorMsg.style.display = 'none';

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 3000);

      } catch (err) {
        errorMsg.textContent = '❌ ' + err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Сохранить пароль';
      }
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
