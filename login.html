<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Backend Boost</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #faf5ff, #fff5f9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(139, 92, 246, 0.15);
      border: 1px solid #f0e6ff;
    }

    .auth-card .logo {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #8B5CF6, #FF69B4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .auth-card .subtitle {
      text-align: center;
      color: #666;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .auth-card label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .auth-card input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #f0e6ff;
      border-radius: 12px;
      font-size: 16px;
      transition: border 0.3s;
      margin-bottom: 16px;
      background: #fafafa;
    }

    .auth-card input:focus {
      outline: none;
      border-color: #8B5CF6;
      background: white;
    }

    .auth-card .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #8B5CF6, #FF69B4);
      color: white;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .auth-card .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
    }

    .auth-card .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .auth-card .footer-text {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }

    .auth-card .footer-text a {
      color: #8B5CF6;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-card .footer-text a:hover {
      text-decoration: underline;
    }

    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .hidden {
      display: none;
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="logo">✦ Backend Boost</div>
  <div class="subtitle">Войди в свой кабинет</div>

  <div id="errorMsg" class="error-msg"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="ivan@example.com" required />

    <label for="password">Пароль</label>
    <input type="password" id="password" placeholder="••••••••" required />

    <button type="submit" class="btn" id="submitBtn">Войти</button>
  </form>

  <div class="footer-text">
    Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
  </div>
</div>

<script>
  // Подключаем Supabase
  const SUPABASE_URL = 'https://ssvefponwetcgpbfxepn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzdmVmcG9ud2V0Y2dwYmZ4ZXBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTc0NzIsImV4cCI6MjEwMDg3MzQ3Mn0.2tKEk-ssC1ov04mMNQrMGPHRTTDyrnhmjVfCT5lwr0I';

  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (typeof supabase === 'undefined') {
      errorMsg.textContent = '⚠️ Ошибка загрузки Supabase. Попробуй обновить страницу.';
      errorMsg.style.display = 'block';
      return;
    }

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Проверяем, не залогинен ли уже пользователь
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        // Если уже залогинен — отправляем в кабинет
        window.location.href = '/dashboard.html';
      }
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorMsg.textContent = '⚠️ Заполни все поля.';
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loader"></span> Вход...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw new Error(error.message);
        }

        if (data.session) {
          // Сохраняем сессию
          localStorage.setItem('sb-user-email', email);
          window.location.href = '/dashboard.html';
        } else {
          throw new Error('Не удалось войти.');
        }

      } catch (err) {
        errorMsg.textContent = '❌ ' + err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
